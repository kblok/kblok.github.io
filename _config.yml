# Hardkoded — Swimmer theme preview
title: Hardkoded
tagline: Dev notes from Darío Kondratiuk
description: Dev notes from the maintainer of Puppeteer-Sharp
url: "https://www.hardkoded.com"
baseurl: ""
permalink: pretty
timezone: America/BuenosAires
markdown: kramdown
highlighter: rouge
excerpt_length: 40

kramdown:
  input: GFM
  syntax_highlighter: rouge

author:
  name: Darío Kondratiuk
  email: dariokondratiuk@gmail.com
  url: https://www.hardkoded.com
  twitter: hardkoded

twitter:
  username: hardkoded
  card: summary_large_image

social:
  name: Darío Kondratiuk
  links:
    - https://twitter.com/hardkoded
    - https://github.com/kblok
    - https://github.com/hardkoded

logo: /img/avatar-icon.png

# Analytics — GA4 measurement ID (hardkoded - GA4)
google_analytics: G-PPQ7XLRQFR

# Swimmer + SEO plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-gist

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

# Tag index generator (_plugins/_tag_gen.rb)
link-tags: true
tag_dir: tag

exclude:
  - .editorconfig
  - .git
  - .github
  - .jekyll-cache
  - .claude
  - _css
  - AGENTS.md
  - CLAUDE.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - LICENSE.md
  - Makefile
  - PREVIEW.md
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - voice.md
  - Vagrantfile
  - vendor
  - preview-artifacts
